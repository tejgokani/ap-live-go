# anything-pipeline plan. `plan:` is rewritten by `ap init`; `overrides:` is yours and is preserved.
# Overrides: units.<path>.verify {flavor, vars.pm} replaces detection; verify / units.<path>.inputs set
# verify.yml inputs (node-version, test-command, ...).
version: 1
template:
  repo: tejgokani/anything-pipeline
  ref: 94f5bcbfa0a9805cdd3b65d18d4747cf46993b6b
plan:
  units:
  - path: .
    kinds:
    - go-service
    verify:
      flavor: go
      vars: {}
    ship:
      pipeline: ship-app
      flavor: container
  always:
  - verify
  - agent-gate
  - harden
overrides: {}
disabled: []
ejected: []
