# ap-sha256: c890c0b3e29531254e4ce2a90947bbbae5f098d3e38fbe743aea38f36887e95f
name: verify

on:
  pull_request:
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  verify:
    name: "verify"
    permissions:
      contents: read
    uses: tejgokani/anything-pipeline/.github/workflows/verify.yml@94f5bcbfa0a9805cdd3b65d18d4747cf46993b6b # pre-v0.0.1-fix
    with:
      flavor: "go"
      working-directory: "."

  # The only check branch protection needs to require. Skipped jobs pass; failed or cancelled ones do not.
  gate:
    name: gate
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every verify job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null; then
            echo "All verify jobs passed."
          else
            echo "::error::At least one verify job failed or was cancelled."
            exit 1
          fi
