# ap-sha256: efc70f80a15bdc657e933f5da07fe554cdc8f3d7f5301ccda1a2eba98d3d2a6a
name: verify

on:
  pull_request:
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  verify:
    name: "verify"
    permissions:
      contents: read
    uses: tejgokani/anything-pipeline/.github/workflows/verify.yml@5cd39108a1fffe03352c32317c1ac8c8241acdb3 # pre-v0.0.1
    with:
      flavor: "go"
      working-directory: "."

  # The only check branch protection needs to require. Skipped jobs pass; failed or cancelled ones do not.
  gate:
    name: gate
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every verify job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null; then
            echo "All verify jobs passed."
          else
            echo "::error::At least one verify job failed or was cancelled."
            exit 1
          fi
